# RUN-019.D1: the localhost-only UI proxy (RUN-001.D5, R-RUN-1). Its only upstream is app:8000.
# M4 is read-only (R-API-3's writes are M8), so it forwards GET and HEAD only. No access log, and
# the error log only at `crit`: nginx's `error` lines quote the request line, which carries query
# filters and hashes, and it would land in `docker logs`. Config errors still print (`emerg`).
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 64;
}

http {
    server_tokens off;
    access_log off;
    client_max_body_size 1k;

    # Docker's embedded DNS, so app:8000 is resolved per request: the proxy starts even while
    # `app` isn't listening yet, and answers 502 until it is.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8000;

        location / {
            limit_except GET {    # GET also allows HEAD
                deny all;
            }
            set $upstream http://app:8000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;    # /api/events is SSE (R-API-2)
            proxy_read_timeout 1h;
        }
    }
}
