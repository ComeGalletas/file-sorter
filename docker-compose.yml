# file-sorter runtime (RUN-001, DESIGN.md §9).
# Networks (RUN-001.D4): `internal` has no internet route; only ollama (model pulls)
# and searxng (it forwards queries) also join `egress`. The only published port is the UI's,
# 127.0.0.1:8000 on `ui-proxy` (RUN-019, RUN-001.D5, R-RUN-1).
name: file-sorter

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-env: &env
  DB_DSN: postgresql://classifier:${DB_PASSWORD:?run make init}@db:5432/classifier
  OLLAMA_HOST: http://ollama:11434
  SEARXNG_URL: http://searxng:8080
  CLASSIFIER_CONFIG: /app/config.yaml
  HF_HOME: /models/hf
  HF_HUB_OFFLINE: "1"

x-app: &app
  build: .
  image: file-sorter-app:dev
  <<: *gpu

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: classifier
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run make init}
      POSTGRES_DB: classifier
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classifier -d classifier"]
      interval: 2s
      timeout: 3s
      retries: 30

  ollama:
    image: ollama/ollama:0.35.1
    <<: *gpu
    environment:
      # RUN-016.D1: one resident model. Two 8B models at once filled the GPU and pushed host RAM
      # to its limit in the M3 spike; every call shares one model and one num_ctx (CLS-004.D9).
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama:/root/.ollama
    networks: [internal, egress]

  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run make init}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [internal, egress]

  app:
    <<: *app
    environment:
      <<: *env
      SANITIZE_LOG_KEY: ${SANITIZE_LOG_KEY:?run make init}   # SAN-001.D5; app and test only, never fetch
    # RUN-019.D2: the container serves the read-only API and UI on the internal network only;
    # `ui-proxy` alone publishes it, on 127.0.0.1:8000. RUN-001.D11 still holds: run the CLI with
    # `docker compose exec app classifier ...`.
    command: ["classifier", "serve", "--host", "0.0.0.0"]
    volumes:
      - .:/app
      - hf:/models/hf
      # R-FOP-8: the human's source folder is read-only. Never change this mount
      # (docker-compose.purge.yml is the only, opt-in exception).
      - type: bind
        source: ${SOURCE_ROOT:?set SOURCE_ROOT in .env}
        target: /source
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RESULTS_ROOT:?set RESULTS_ROOT in .env}
        target: /results
        bind:
          create_host_path: true
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # RUN-001.D6: no /source or /results mounts. Tests only ever see the repo and fixtures/.
  test:
    <<: *app
    profiles: [test]
    environment:
      <<: *env
      DB_DSN: postgresql://classifier:test@db-test:5432/classifier
      SANITIZE_LOG_KEY: ${SANITIZE_LOG_KEY:?run make init}   # SAN-001.D5
    command: ["pytest"]
    volumes:
      - .:/app
      - hf:/models/hf
      # RUN-009.D1: the git-ignored real fixtures, read-only. In a linked worktree, the Makefile
      # and compose_test point FIXTURE_IMAGES at the main checkout's copy (never committed).
      - type: bind
        source: ${FIXTURE_IMAGES:-./fixtures/images}
        target: /app/fixtures/images
        read_only: true
        bind:
          create_host_path: true   # a checkout without fixtures gets an empty folder, not an error
    depends_on:
      db-test:
        condition: service_healthy
    networks: [internal]

  db-test:
    image: pgvector/pgvector:0.8.7-pg16
    profiles: [test]
    environment:
      POSTGRES_USER: classifier
      POSTGRES_PASSWORD: test
      POSTGRES_DB: classifier
    tmpfs:
      - /var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classifier -d classifier"]
      interval: 1s
      timeout: 3s
      retries: 30

  # RUN-019.D1 (RUN-001.D5, R-RUN-1): the UI's only published port, localhost-only. Docker can't
  # publish from the internal-only network, so the proxy alone also joins `ui`, a bridge no other
  # service joins. Its only upstream is app:8000 (docker/ui-proxy/nginx.conf), GET/HEAD only.
  ui-proxy:
    image: nginx:1.30.5-alpine
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./docker/ui-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on: [app]
    networks: [internal, ui]

  # R-MOD-2: the only app-image container with internet; fetches HF weights once.
  fetch:
    <<: *app
    profiles: [tools]
    environment:
      <<: *env
      HF_HUB_OFFLINE: "0"
    command: ["python", "scripts/fetch_models.py"]
    volumes:
      - .:/app
      - hf:/models/hf
    networks: [egress]

networks:
  internal:
    internal: true
  egress: {}
  ui: {}   # RUN-019.D1: ui-proxy only, so 127.0.0.1:8000 can be published

volumes:
  pgdata:
  # RUN-002.D2 + RUN-005.D2: shared by every worktree's compose project, owned by none.
  # External, so no project claims them (no 'created for project' warning); `make init`
  # creates them, because compose never creates external volumes.
  ollama:
    name: file-sorter_ollama
    external: true
  hf:
    name: file-sorter_hf
    external: true
