[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "file-sorter"
version = "0.0.1"
description = "Local image classification bot: sanitize, classify, name and file images into folders (MVP)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# torch is NOT listed: the Dockerfile installs a CUDA build from PyTorch's index (RUN-001.D2).
# Lower bounds only; a lockfile is a follow-up (RUN-001.D9).
dependencies = [
    "langgraph>=0.6",
    "typer>=0.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "pillow-heif>=0.18",
    "transformers>=4.50",
    "huggingface-hub>=0.25",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "protobuf>=5.0",
    "httpx>=0.27",
    "watchdog>=5.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff==0.16.10",
]

[project.scripts]
classifier = "classifier.cli:app"

[tool.setuptools.packages.find]
include = ["classifier*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# agent-office keeps worker worktrees inside the repo folder (RUN-003); lint each in its own tree.
extend-exclude = [".agent-office"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tiers are assigned by path in tests/conftest.py (CLAUDE.md §3). The default run
# is unit + db + integration; `make test-gpu` and `make gate-N` select the others.
addopts = "-m 'not gpu and not gate' --import-mode=importlib"
markers = [
    "unit: nothing external; fakes for the db, models and Ollama",
    "db: a throwaway migrated Postgres from the test profile",
    "integration: the full graph on fixtures with recorded model responses",
    "gpu: real SigLIP, NSFW and Ollama on the box",
    "gate: milestone metrics on the real labelled fixtures",
]
