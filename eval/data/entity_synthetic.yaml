# Fictional names for the entity eval (MOD-001.D3) and gate 2's third source (TST-005.D2).
# Every value is invented: no real person, organisation, brand or place, and nothing that
# could be read as the human's (SAN-001.D10). Add only invented names.
version: 1

people:
  first: [Zorvane, Mirelda, Oskarth, Tamsin, Velric, Ysolde, Brannoch, Quenna, Darvik, Elowyn,
          Thessaly, Corvin, Ilsabet, Morrow, Fenwyck, Sarvela]
  last: [Quillby, Toskan, Venmire, Druvel, Ashgrove, Pellumbra, Kestrand, Oruvane, Haldric,
         Wintermoss, Delvane, Scorrin, Tavernack, Brightwell, Morcaster, Ulvenhold]

orgs: [Quillfen Robotics, Durnhollow Athletic Club, Brakmoor Works, Ostrela Freight,
       Venmark Studios, Hollowpine Academy, Saltreach Rowing Club, Krellwick Bakery,
       Emberfall Records, Thornquist Labs, Glimmerdeep Theatre, Pallisade Mutual]

places: [Brakmoor Harbour, Velkarra, Ostrela Bay, Dunmarrow, Saltreach, Kestrel Fells,
         Orvane Valley, Thistledown, Corrowmere, Ashenford, Lyrravale, Murkwater Bridge]

# Filename-shaped patterns. {person}, {org}, {place} are the seeded entities; {date},
# {year} and {n} are plain values that must never be redacted.
patterns:
  - "{person}_{date}_{n}"
  - "{person} at {place}"
  - "{org}_offsite_{place}"
  - "{place} trip {year} - {person}"
  - "IMG_{date}_{n} {person}"
  - "{org} team photo {n}"
  - "birthday_{person}_party"
  - "{person}.{place}.{year}"
  - "{org}-{year}-annual-dinner"
  - "{place}_{date}_sunset"
  - "DSC{n} {person} and {person2}"
  - "{person}-{org}-{year}"

# Separators a multi-word name is joined with ("" means CamelCase).
separators: ["_", "-", " ", ".", ""]

# Filename-shaped strings with no entity. Any redaction here is a false redaction.
